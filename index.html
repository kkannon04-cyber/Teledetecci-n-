<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visor de teledetección aeronáutica</title>
  <!-- Icono embebido: el navegador pide favicon.ico por su cuenta y sin esto
       deja un 404 en la consola de cualquiera que abra el visor. -->
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="%230d1117"/><circle cx="16" cy="16" r="9.5" fill="none" stroke="%234da3ff" stroke-width="1.4" opacity=".45"/><path d="M16 6.5 17.6 14 25 17.2v1.4l-7.4-1.6v4.4l2.2 2v1.2L16 23.4l-3.8 1.2v-1.2l2.2-2v-4.4L7 18.6v-1.4L14.4 14z" fill="%234da3ff"/></svg>' />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="css/estilo.css" />
</head>
<body>

<div id="app">

  <header id="cabecera">
    <h1 id="titulo-caso">Visor de teledetección aeronáutica</h1>
    <span class="sub" id="sub-caso"></span>
    <span class="aviso-ejemplo" id="aviso-ejemplo" hidden>DATOS DE EJEMPLO</span>
    <div id="reloj-z">--:--Z</div>
    <div class="acciones">
      <button id="btn-comparar" title="Comparar dos bandas con cortina deslizante">Comparar bandas</button>
      <button id="btn-perfil" hidden title="Corte vertical de la ruta: tope de nube calculado frente al nivel de crucero">Perfil</button>
      <button id="btn-cabina" hidden title="Panel de vuelo: posición, alertas y puntos de decisión">EFB</button>
      <button id="btn-portada" title="Volver a la portada de la sustentación">Portada</button>
      <button id="btn-lateral" title="Plegar o desplegar el panel de herramientas (tecla H)">Panel ⟩</button>
    </div>
  </header>

  <main id="escenario">
    <div id="lienzo-principal">
      <div id="mapa"></div>
      <div id="panel-satelite">
        <div class="etq-sat" id="etq-sat" hidden></div>
        <div id="contenido-sat"></div>
      </div>

      <div id="narracion" hidden>
        <button id="narracion-cerrar" title="Cerrar la narración (Esc)">×</button>
        <h2 id="narracion-titulo"></h2>
        <p id="narracion-texto"></p>
        <div class="pista">← →  cambiar escena     ·     Esc  cerrar</div>
      </div>
    </div>

    <!-- Corte vertical: distancia contra altitud, bajo el mapa. -->
    <section id="perfil" hidden>
      <div id="perfil-cab">
        <span class="pf-tit">Corte vertical de la ruta</span>
        <span id="perfil-pie"></span>
      </div>
      <div id="perfil-cuerpo"></div>
    </section>
  </main>

  <aside id="lateral">
    <div class="pestanas">
      <div class="pestana activa" data-pestana="capas">Capas</div>
      <div class="pestana" data-pestana="tramos">Tramos</div>
      <div class="pestana" data-pestana="bandas">Bandas</div>
      <div class="pestana" data-pestana="meteo">METAR/TAF</div>
      <div class="pestana" data-pestana="fenomenos">Fenómenos</div>
      <div class="pestana" data-pestana="alterno">Alterno</div>
    </div>

    <div class="contenido-pestana activa" id="tab-capas"></div>
    <div class="contenido-pestana" id="tab-tramos"></div>
    <div class="contenido-pestana" id="tab-bandas"></div>
    <div class="contenido-pestana" id="tab-meteo"></div>
    <div class="contenido-pestana" id="tab-fenomenos"></div>
    <div class="contenido-pestana" id="tab-alterno"></div>
  </aside>

  <footer id="barra">
    <div id="marcas"></div>
    <div class="fila-tiempo">
      <button id="ctrl-play" title="Reproducir / pausar la ventana temporal">▶</button>
      <span class="etq-tiempo" id="etq-inicio"></span>
      <input type="range" id="linea-tiempo" min="0" max="100" value="0" step="1" />
      <span class="etq-tiempo" id="etq-fin"></span>
    </div>
  </footer>

  <!-- Panel de vuelo. Flota sobre la interfaz para poder consultarse sin perder el mapa. -->
  <section id="efb" hidden></section>

  <!-- Portada: lo primero que ve la sala. Su contenido sale de caso.meta. -->
  <section id="portada" hidden></section>

</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
